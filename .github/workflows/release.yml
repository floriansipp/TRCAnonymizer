name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          modules: 'qt5compat'
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake TRCAnonymizer.pro CONFIG+=release
          nmake
      - name: Package
        shell: cmd
        run: |
          mkdir deploy
          copy release\TRCAnonymizer.exe deploy\
          windeployqt deploy\TRCAnonymizer.exe
      - name: Create ZIP
        shell: bash
        run: |
          VERSION_NUM=${VERSION#v}
          VERSION_NUM=${VERSION_NUM#V}
          cd deploy && zip -r ../TRCAnonymizer.${VERSION_NUM}.win64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: TRCAnonymizer.*.win64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          modules: 'qt5compat'
      - name: Build
        run: |
          qmake TRCAnonymizer.pro CONFIG+=release
          make -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          VERSION_NUM=${VERSION#v}
          VERSION_NUM=${VERSION_NUM#V}
          macdeployqt TRCAnonymizer.app
          codesign --force --deep --sign - TRCAnonymizer.app
          zip -r TRCAnonymizer.${VERSION_NUM}.armosx.zip TRCAnonymizer.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: TRCAnonymizer.*.armosx.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          modules: 'qt5compat'
      - name: Build
        run: |
          qmake TRCAnonymizer.pro CONFIG+=release
          make -j$(nproc)
      - name: Package
        run: |
          VERSION_NUM=${VERSION#v}
          VERSION_NUM=${VERSION_NUM#V}
          mkdir -p deploy
          cp TRCAnonymizer deploy/
          cd deploy && zip -r ../TRCAnonymizer.${VERSION_NUM}.linux64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: TRCAnonymizer.*.linux64.zip

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/*.zip
            macos-build/*.zip
            linux-build/*.zip
          generate_release_notes: true
